<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Image Tracker Test</title>
  <script src="https://aframe.io"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: https://jsdelivr.net;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="avatarModel" src="https://jsdelivr.net"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    
      <a-gltf-model src="#avatarModel" position="0 0 0.1" scale="0.005 0.005 0.005" rotation="0 0 0"></a-gltf-model>
    
  </a-scene>
</body>
</html>
