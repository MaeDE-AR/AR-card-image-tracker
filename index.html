<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebAR Image Tracker</title>
  <!-- Exact A-Frame + AR.js NFT (Natural Feature Tracking) scripts -->
  <script src="https://jsdelivr.net"></script>
  <script src="https://githack.com"></script>

  <style>
    .arjs-loader {
      height: 100%; width: 100%; position: absolute; top: 0; left: 0;
      background-color: rgba(0, 0, 0, 0.85); z-index: 9999;
      display: flex; justify-content: center; align-items: center;
    }
    .arjs-loader div {
      text-align: center; font-size: 1.25em; color: white; font-family: sans-serif;
    }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">
  <!-- Loading overlay while image descriptors load into memory -->
  <div class="arjs-loader">
    <div>Loading image descriptors...</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <!-- Replace 'markers/marker' with the path & base name of your 3 .fset/.iset files (NO file extension) -->
    <a-nft
      type="nft"
      url="./markers/marker"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5">

      <!-- 3D content anchored to the image (starts with a simple 3D box so you can verify tracking immediately) -->
      <a-box position="50 50 -100" scale="80 80 80" color="#4CC3D9"></a-box>
      
      
      
      -->
    </a-nft>

    
  </a-scene>
</body>
</html>
