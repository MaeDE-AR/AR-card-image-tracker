<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moderne WebAR Bildegjenkjenning</title>
    <!-- Moderne, oppdaterte biblioteker -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Kobles automatisk til T-Rex-bildet i targets.mind -->
      
        <!-- Rød 3D-boks som dukker opp på bildet -->
        <a-box position="0 0 0.25" scale="0.5 0.5 0.5" color="red"></a-box>
      
    </a-scene>
  </body>
</html>
